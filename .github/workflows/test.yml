name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
  scribus-ui:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ".[test,scribus]"
      - run: python -m pytest tests/test_scribus_export.py tests/test_scribus_batch.py -q --junitxml=scribus-ui-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scribus-ui-${{ matrix.os }}
          path: scribus-ui-results.xml
  older-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install ".[test]" "pikepdf>=9,<10" "PyMuPDF>=1.24.3,<1.25" "Pillow>=10,<11"
      - run: python -m pytest -q --junitxml=older-dependencies.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: older-dependencies
          path: older-dependencies.xml
